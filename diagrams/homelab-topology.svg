<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
<title id="title">Rob's infrastructure homelab</title>
<desc id="desc">Documented build topology: upstream home network reaches the Windows Server host over Wi-Fi. Its Ethernet interface connects to the Cisco 3750G and VLAN 10, alongside three Proxmox nodes and a WDS-imaged client. PBS is hosted on pve-01 and the Ubuntu Docker VM on pve-02. All nodes use Windows NFS shared storage. Logical storage and backup flows use the lab network; they are not separate cables. VLAN 20 is a secondary test segment.</desc>
