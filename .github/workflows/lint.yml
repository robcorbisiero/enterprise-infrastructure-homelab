---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: yamllint + ansible-lint + compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install yamllint ansible-lint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
        working-directory: ansible

      - name: Validate the monitoring compose file
        run: docker compose config --quiet
        working-directory: monitoring
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
