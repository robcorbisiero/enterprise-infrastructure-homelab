---
- name: Install and configure node_exporter on Proxmox nodes
  hosts: proxmox
  become: true
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_checksum: "sha256:6809dd0b3ec45fd6e992c19071d6b5253aed3ead7bf0686885a51d85c6643c66"
    node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64"

  tasks:
    - name: Create node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Check which node_exporter version is currently installed
      ansible.builtin.command: /usr/local/bin/node_exporter --version
      register: node_exporter_installed
      changed_when: false
      failed_when: false

    - name: Decide whether node_exporter needs installing or upgrading
      ansible.builtin.set_fact:
        node_exporter_install_required: >-
          {{ node_exporter_installed.rc != 0
             or ((node_exporter_installed.stdout | default('')
                   ~ node_exporter_installed.stderr | default(''))
                 | regex_findall('version ([^ ,\n]+)')
                 | first | default('')) != node_exporter_version }}

    - name: Download node_exporter release
      ansible.builtin.get_url:
        url: >-
          https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{
          node_exporter_archive }}.tar.gz
        dest: "/tmp/{{ node_exporter_archive }}.tar.gz"
        checksum: "{{ node_exporter_checksum }}"
        mode: "0644"
      when: node_exporter_install_required | bool

    - name: Extract node_exporter archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_archive }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: node_exporter_install_required | bool

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_archive }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: "0755"
        remote_src: true
      when: node_exporter_install_required | bool
      notify: Restart node_exporter

    - name: Remove node_exporter download artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ node_exporter_archive }}.tar.gz"
        - "/tmp/{{ node_exporter_archive }}"
      when: node_exporter_install_required | bool

    - name: Install node_exporter systemd unit
      ansible.builtin.template:
        src: templates/node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
