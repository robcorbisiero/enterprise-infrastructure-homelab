---
- name: Ensure Docker is installed and the monitoring stack is running
  hosts: docker_hosts
  become: true
  vars:
    repo_path: "{{ playbook_dir }}/../.."

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Resolve the dpkg architecture for the apt repository
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_architecture
      changed_when: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ dpkg_architecture.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Check for the monitoring environment file
      ansible.builtin.stat:
        path: "{{ repo_path }}/monitoring/.env"
      register: monitoring_env

    - name: Require monitoring credentials before deployment
      ansible.builtin.assert:
        that: monitoring_env.stat.exists
        fail_msg: Copy monitoring/.env.example to monitoring/.env and set GRAFANA_ADMIN_PASSWORD first.

    - name: Deploy the monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ repo_path }}/monitoring"
        state: present
