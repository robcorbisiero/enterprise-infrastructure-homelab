---
- name: Ensure Docker is installed and the monitoring stack is running
  hosts: docker_hosts
  become: true
  vars:
    repo_path: "/home/administrator/enterprise-infrastructure-homelab"
    repo_url: "https://github.com/robcorbisiero/enterprise-infrastructure-homelab.git"

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Resolve the dpkg architecture for the apt repository
      command: dpkg --print-architecture
      register: dpkg_architecture
      changed_when: false

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Ensure the homelab repo is present on the Docker host
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: main
        update: false

    - name: Deploy the monitoring stack
      community.docker.docker_compose_v2:
        project_src: "{{ repo_path }}/monitoring"
        state: present
